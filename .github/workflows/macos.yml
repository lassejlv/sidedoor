name: macOS
on:
  push:
    branches: [main, 'codex/cargo-workspace']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: SDK dependencies for UI tests
        working-directory: sdk
        run: bun install --frozen-lockfile
      - name: Format
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Packaging dependencies
        run: brew install librsvg
      - name: Apple signing credentials
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/package/macos-signing-setup.sh
      - name: Package
        env:
          APPLE_REQUIRE_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && '1' || '0' }}
          APPLE_NOTARIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && '1' || '0' }}
        run: ./scripts/package/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sidedoor-macos-arm64
          path: |
            target/release/bundle/Sidedoor-macos-arm64.zip
            target/release/bundle/Sidedoor-macos-arm64.dmg
            target/release/bundle/Sidedoor-macos-arm64.*.sha256
          if-no-files-found: error
      - name: Remove Apple signing credentials
        if: always() && env.APPLE_SIGNING_DIR != ''
        run: |
          security delete-keychain "$APPLE_SIGNING_DIR/signing.keychain-db" || true
          rm -rf "$APPLE_SIGNING_DIR"
